<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="20"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#glow)" stroke-width="20" stroke-dasharray="1130" stroke-dashoffset="340" stroke-linecap="round"/>
  
  <!-- Central Cash / Salary Icon -->
  <g filter="url(#shadow)">
    <!-- Credit / Wallet Card Base -->
    <rect x="136" y="176" width="240" height="160" rx="24" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="4"/>
    <rect x="156" y="210" width="200" height="40" rx="8" fill="url(#glow)"/>
    <circle cx="206" cy="286" r="18" fill="#38bdf8"/>
    <circle cx="240" cy="286" r="18" fill="#a855f7" fill-opacity="0.75"/>
    <!-- Dynamic Trending Arrow -->
    <path d="M300 295 L330 265 M330 265 L312 265 M330 265 L330 283" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
